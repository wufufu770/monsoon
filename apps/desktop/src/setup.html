<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'"
    />
    <title>Monsoon 设置</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-name">Monsoon</span>
      <button id="quit" class="titlebar-quit" type="button" title="退出 Monsoon">退出</button>
    </header>

    <main class="shell">
      <h1 class="heading">欢迎使用 Monsoon</h1>
      <p class="subheading">选择这台机器上 agent 的运行方式。</p>

      <form id="setup" novalidate>
        <fieldset class="choices">
          <legend class="sr-only">运行方式</legend>

          <label class="choice" for="mode-new">
            <input id="mode-new" type="radio" name="mode" value="new" checked />
            <span class="choice-title">本机模式（推荐）— agent 在这台电脑上运行</span>
          </label>

          <label class="choice" for="mode-existing">
            <input id="mode-existing" type="radio" name="mode" value="existing" />
            <span class="choice-title">连接 Loom 中心 — 编排与审计交给 Loom</span>
          </label>
        </fieldset>

        <section id="panel-new" class="panel">
          <div id="stack" hidden>
            <div class="stack-head">
              <p id="stack-phase" class="stack-phase" role="status" aria-live="polite"></p>
              <button
                id="stack-details"
                class="icon-button"
                type="button"
                aria-controls="stack-output"
                aria-expanded="false"
                aria-label="技术细节"
                title="技术细节"
              >
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="M3.5 4.5 7 8l-3.5 3.5M8.5 11.5H13" />
                </svg>
              </button>
            </div>
            <div
              id="stack-progress"
              class="progress"
              role="progressbar"
              aria-label="设置进度"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              hidden
            >
              <div id="stack-progress-fill" class="progress-fill"></div>
            </div>
            <p id="stack-detail" class="stack-detail"></p>
            <pre id="stack-output" class="stack-output" hidden></pre>
            <div id="stack-docker-help" class="stack-help" hidden>
              <button class="link" type="button" data-link="docker-desktop">Docker Desktop</button>
              <button class="link" type="button" data-link="orbstack">OrbStack</button>
              <button class="link" type="button" data-link="docker-engine">Docker Engine</button>
            </div>
          </div>
        </section>

        <section id="panel-existing" class="panel" hidden>
          <label class="field-label" for="server-url">Loom 中心地址</label>
          <input
            id="server-url"
            class="field"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="https://loom.example.com"
          />
          <details id="server-headers-section" class="headers">
            <summary>自定义请求头</summary>
            <textarea
              id="server-headers"
              class="field"
              rows="2"
              spellcheck="false"
              autocomplete="off"
              aria-label="自定义请求头"
              placeholder="名称: 值"
            ></textarea>
          </details>
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="actions">
          <button id="check" class="button button-secondary" type="button">检查连接</button>
          <button id="continue" class="button button-primary" type="submit">继续</button>
        </div>
      </form>
    </main>

    <script src="setup.js"></script>
  </body>
</html>
